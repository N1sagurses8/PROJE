<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RED BULL LILAC EDITION</title>
<style>
:root{
  --bg:#0b0b0f; --card:#141420; --border:#24243a; --txt:#f5f5ff; --muted:#b9b9d6; --accent:#a855f7;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial;background:radial-gradient(1200px 600px at 20% -10%, #3b1d6b 0%, var(--bg) 45%);color:var(--txt)}
.wrap{max-width:820px;margin:auto;padding:24px}
.card{background:linear-gradient(180deg, #17172a, var(--card));border:1px solid var(--border);border-radius:20px;padding:22px}
.hero{position:relative;overflow:hidden}
.hero h1{margin:0 0 10px;font-size:32px;letter-spacing:.4px}
.hero .badge{display:inline-flex;gap:8px;align-items:center;color:#ffd1ff}
.hero .list{margin:14px 0 0;padding-left:18px}
.hero .list li{margin:6px 0}
.sep{height:1px;background:linear-gradient(90deg,transparent,#2c2c52,transparent);margin:22px 0}
h2{margin:0 0 10px}
input,textarea,button{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#0f0f18;color:var(--txt)}
textarea{min-height:110px;resize:vertical}
button{cursor:pointer;background:linear-gradient(180deg,#b26bff,#7c3aed);border:none;font-weight:700}
.grid{display:grid;gap:12px}
.item{background:#0f0f18;border:1px solid var(--border);border-radius:14px;padding:14px}
.top{display:flex;justify-content:space-between;gap:10px}
.small{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#23234a}
</style>
</head>
<body>
<div class="wrap">

  <!-- HERO -->
  <div class="card hero">
    <div class="badge">💜 <b>RED BULL LILAC EDITION</b></div>
    <p class="small">Mor modu aç.</p>
    <p><b>LILAC EDITION</b> = Enerji ama cool.</p>
    <p class="small">Klasik enerjiyi çiçeksi lilac aromasıyla upgrade eder.</p>
    <ul class="list">
      <li>⚡ Daha hafif.</li>
      <li>🌸 Daha fresh.</li>
      <li>🎧 Daha ritmik.</li>
    </ul>
    <p class="small">Evde, oyunda, müzikte, sokakta…</p>
    <p><b>Mor hisset. Ritmi aç. Eğlence başlasın 🚀</b></p>
    <span class="tag">slug: <b id="slugTag"></b></span>
  </div>

  <div class="sep"></div>

  <!-- COMMENTS -->
  <div class="card">
    <h2>💬 Yorumlar</h2>
    <div class="grid">
      <input id="name" placeholder="İsminiz (opsiyonel)"/>
      <textarea id="content" placeholder="Yorumunuzu yazın…"></textarea>
      <button id="sendBtn">Yorumu Gönder</button>
      <div id="status" class="small"></div>
    </div>
  </div>

  <div class="card">
    <div id="list" class="grid"></div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://hbezsauafsawefmlwazb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiZXpzYXVhZnNhd2VmbWx3YXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTY0MDksImV4cCI6MjA4NTYzMjQwOX0.zLsUcFThJZdTLFNkslVYz4_S40lEjm4aOi_-2g9T4us";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const params = new URLSearchParams(location.search);
const slug = params.get("slug") || "red-bull-lilac-edition";
document.getElementById("slugTag").textContent = slug;

const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

function esc(s){
  return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function load(){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/comments?slug=eq.${encodeURIComponent(slug)}&order=created_at.desc&limit=50`,
      { headers }
    );

    if(!res.ok){
      const text = await res.text().catch(()=> "");
      listEl.innerHTML = `<div class="small">❌ Liste hata (${res.status}): ${esc(text.slice(0,160))}</div>`;
      return;
    }

    const data = await res.json();
    listEl.innerHTML = data.length ? data.map(x=>`
      <div class="item">
        <div class="top">
          <b>${esc(x.name||"Anonim")}</b>
          <span class="small">${new Date(x.created_at).toLocaleString("tr-TR")}</span>
        </div>
        <div>${esc(x.content)}</div>
      </div>
    `).join("") : `<div class="small">Henüz yorum yok.</div>`;
  }catch(e){
    listEl.innerHTML = `<div class="small">❌ Liste isteği başarısız.</div>`;
  }
}

async function send(){
  const name = document.getElementById("name").value.trim();
  const content = document.getElementById("content").value.trim();
  if(content.length < 2){ statusEl.textContent="Yorum çok kısa."; return; }

  statusEl.textContent="Gönderiliyor…";
  sendBtn.disabled = true;

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comments`,{
      method:"POST",
      headers: {
        ...headers,
        "Prefer": "return=representation"
      },
      body: JSON.stringify({ slug, name: name || null, content })
    });

    if(!res.ok){
      const text = await res.text().catch(()=> "");
      statusEl.textContent = `❌ Gönderim hata (${res.status}): ${text.slice(0,160)}`;
      sendBtn.disabled = false;
      return;
    }

    document.getElementById("content").value="";
    statusEl.textContent="✅ Gönderildi";
    sendBtn.disabled = false;
    await load();
  }catch(e){
    statusEl.textContent = "❌ Gönderim başarısız (ağ/policy).";
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", send);
load();
</script>
</body>
</html>
