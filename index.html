<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RED BULL LILAC EDITION</title>

  <style>
    :root{
      --bg:#0b0b0f;
      --card:#141420;
      --border:#24243a;
      --txt:#f5f5ff;
      --muted:#b9b9d6;
      --accent:#a855f7;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui, -apple-system, Segoe UI, Arial;
      color:var(--txt);
      background:
        radial-gradient(1200px 600px at 20% -10%, #3b1d6b 0%, var(--bg) 45%);
    }
    .wrap{max-width:820px;margin:auto;padding:24px}
    .card{
      background:linear-gradient(180deg,#17172a,var(--card));
      border:1px solid var(--border);
      border-radius:20px;
      padding:22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .sep{
      height:1px;
      background:linear-gradient(90deg,transparent,#2c2c52,transparent);
      margin:22px 0;
    }

    /* VIDEO */
    .videoWrap{
      overflow:hidden;
      border-radius:18px;
      border:1px solid var(--border);
      background:#0f0f18;
      margin-bottom:16px;
    }
    video{
      width:100%;
      height:min(70vh, 520px);
      display:block;
      object-fit:cover;
    }

    /* HERO */
    .badge{display:inline-flex;gap:8px;align-items:center;color:#ffd1ff}
    .hero h1{margin:0 0 10px;font-size:32px;letter-spacing:.4px}
    .small{font-size:12px;color:var(--muted)}
    .list{margin:14px 0 0;padding-left:18px}
    .list li{margin:6px 0}
    .tag{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:#23234a;
      border:1px solid #2d2d57;
    }

    /* FORM */
    h2{margin:0 0 10px}
    input,textarea,button{
      width:100%;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#0f0f18;
      color:var(--txt);
      outline:none;
    }
    textarea{min-height:110px;resize:vertical}
    button{
      cursor:pointer;
      border:none;
      font-weight:700;
      background:linear-gradient(180deg,#b26bff,#7c3aed);
    }
    button:disabled{opacity:.6;cursor:not-allowed}
    .grid{display:grid;gap:12px}

    /* COMMENTS LIST */
    .item{
      background:#0f0f18;
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
    }
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .name{font-weight:800}
    .time{font-size:12px;color:var(--muted);white-space:nowrap}
    .content{margin-top:8px;line-height:1.35}
  </style>
</head>

<body>
  <div class="wrap">

    <!-- HERO -->
    <div class="card hero">

      <!-- ✅ ÜSTTE VIDEO -->
      <div class="videoWrap">
        <!-- Video dosyan aynı klasörde olmalı: video.mp4 -->
        <video autoplay muted loop playsinline preload="metadata" poster="">
          <source src="video.mp4" type="video/mp4" />
          Tarayıcınız video desteklemiyor.
        </video>
      </div>

      <div class="badge">💜 <b>RED BULL LILAC EDITION</b></div>
      <p class="small">Mor modu aç.</p>

      <p style="margin:10px 0 0;"><b>LILAC EDITION</b> = Enerji ama cool.</p>
      <p class="small" style="margin-top:8px;">Klasik enerjiyi çiçeksi lilac aromasıyla upgrade eder.</p>

      <ul class="list">
        <li>⚡ Daha hafif.</li>
        <li>🌸 Daha fresh.</li>
        <li>🎧 Daha ritmik.</li>
      </ul>

      <p class="small">Evde, oyunda, müzikte, sokakta…</p>
      <p style="margin:10px 0 0;"><b>Mor hisset. Ritmi aç. Eğlence başlasın 🚀</b></p>

      <div style="margin-top:14px;">
        <span class="tag">slug: <b id="slugTag"></b></span>
      </div>
    </div>

    <div class="sep"></div>

    <!-- COMMENT FORM -->
    <div class="card">
      <h2>💬 Yorumlar</h2>
      <div class="grid">
        <input id="name" placeholder="İsminiz (opsiyonel)" />
        <textarea id="content" placeholder="Yorumunuzu yazın…"></textarea>
        <button id="sendBtn">Yorumu Gönder</button>
        <div id="status" class="small"></div>
      </div>
    </div>

    <div style="height:12px"></div>

    <!-- COMMENT LIST -->
    <div class="card">
      <div id="list" class="grid"></div>
    </div>

  </div>

  <script>
    // ✅ SADECE BU 2 SATIR SENİN PROJENE GÖRE
    const SUPABASE_URL = "https://hbezsauafsawefmlwazb.supabase.co";
    const SUPABASE_KEY = "PASTE_ANON_KEY_HERE";

    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };

    const params = new URLSearchParams(location.search);
    const slug = params.get("slug") || "red-bull-lilac-edition";
    document.getElementById("slugTag").textContent = slug;

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");

    function esc(s){
      return (s ?? "").toString().replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    function fmtTime(iso){
      try{
        return new Date(iso).toLocaleString("tr-TR", { dateStyle:"short", timeStyle:"short" });
      }catch{
        return "";
      }
    }

    async function loadComments(){
      listEl.innerHTML = `<div class="small">Yükleniyor…</div>`;

      try{
        const url =
          `${SUPABASE_URL}/rest/v1/comments` +
          `?slug=eq.${encodeURIComponent(slug)}` +
          `&select=id,name,content,created_at` +
          `&order=created_at.desc` +
          `&limit=50`;

        const res = await fetch(url, { headers });

        if(!res.ok){
          const text = await res.text().catch(()=> "");
          listEl.innerHTML = `<div class="small">❌ Liste hata (${res.status}): ${esc(text.slice(0,180))}</div>`;
          return;
        }

        const data = await res.json();

        if(!data.length){
          listEl.innerHTML = `<div class="small">Henüz yorum yok.</div>`;
          return;
        }

        listEl.innerHTML = data.map(x => `
          <div class="item">
            <div class="top">
              <div class="name">${esc(x.name || "Anonim")}</div>
              <div class="time">${esc(fmtTime(x.created_at))}</div>
            </div>
            <div class="content">${esc(x.content)}</div>
          </div>
        `).join("");

      }catch(e){
        listEl.innerHTML = `<div class="small">❌ Liste isteği başarısız (ağ/policy).</div>`;
      }
    }

    async function sendComment(){
      const name = document.getElementById("name").value.trim();
      const content = document.getElementById("content").value.trim();

      if(content.length < 2){
        statusEl.textContent = "Yorum çok kısa.";
        return;
      }

      statusEl.textContent = "Gönderiliyor…";
      sendBtn.disabled = true;

      try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
          method: "POST",
          headers: { ...headers, Prefer: "return=minimal" },
          body: JSON.stringify({
            slug,
            name: name || null,
            content
          })
        });

        if(!res.ok){
          const text = await res.text().catch(()=> "");
          statusEl.textContent = `❌ Gönderim hata (${res.status}): ${text.slice(0,180)}`;
          sendBtn.disabled = false;
          return;
        }

        document.getElementById("content").value = "";
        statusEl.textContent = "✅ Gönderildi";
        sendBtn.disabled = false;
        await loadComments();

      }catch(e){
        statusEl.textContent = "❌ Gönderim başarısız (ağ/policy).";
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendComment);
    loadComments();
  </script>
</body>
</html>
